apiVersion: v1
kind: Service
metadata:
  name: mlflow
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: lyubava
spec:
  type: NodePort
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30500
  selector:
    app.kubernetes.io/name: mlflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: lyubava
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/part-of: lyubava
    spec:
      containers:
        - name: mlflow
          image: lyubava-mlflow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          command:
            - sh
            - -c
          args:
            - >
              mlflow server
              --host 0.0.0.0
              --port 5000
              --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
              --artifacts-destination s3://${MLFLOW_S3_BUCKET}
          envFrom:
            - secretRef:
                name: lyubava-secrets
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20

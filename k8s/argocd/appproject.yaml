apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lyubava
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Lyubava emotion-aware companion stack
  sourceRepos:
    - "*"
  destinations:
    - namespace: lyubava
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

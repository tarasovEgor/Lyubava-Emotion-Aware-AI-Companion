name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies (CPU PyTorch)
        run: bash scripts/ci_install_deps.sh --group dev
      - run: uv run --group dev --no-sync black --check src tests scripts
      - run: uv run --group dev --no-sync ruff check src tests scripts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies (CPU PyTorch)
        run: bash scripts/ci_install_deps.sh --group dev
      - run: uv run --group dev --no-sync pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use npm version from package.json
        run: npm install -g npm@10.9.8
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies (CPU PyTorch)
        run: bash scripts/ci_install_deps.sh --group dev
      - name: Create stub model for Docker smoke test
        run: uv run --group dev --no-sync python scripts/create_stub_model.py
      - uses: docker/setup-buildx-action@v3
      - name: Build image and smoke-test API health
        run: |
          docker build -t lyubava-api:ci .
          docker run -d --name lyubava-api -p 8000:8000 lyubava-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/v1/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs lyubava-api
          exit 1

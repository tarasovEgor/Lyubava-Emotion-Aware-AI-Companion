name: CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase GHCR image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies (CPU PyTorch)
        run: bash scripts/ci_install_deps.sh --group dev

      - name: Pull trained model from DVC (MinIO)
        id: dvc_pull
        continue-on-error: true
        env:
          DVC_S3_ENDPOINT_URL: ${{ secrets.DVC_S3_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: bash scripts/dvc_pull_models.sh

      - name: Create stub model when MinIO/DVC is unavailable
        if: steps.dvc_pull.outcome != 'success'
        run: |
          echo "::warning::DVC pull failed; building API image with stub model."
          echo "::warning::Use a reachable MinIO endpoint in secrets for production images."
          uv run --group dev --no-sync python scripts/create_stub_model.py

      - name: Verify model artifacts for Docker build
        run: |
          test -f models/emotion_classifier/config.json
          test -f models/emotion_classifier/tokenizer_config.json

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:api-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:api-${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:frontend-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:frontend-${{ github.sha }}

      - name: Build and push MLflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mlflow
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:mlflow-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:mlflow-${{ github.sha }}
